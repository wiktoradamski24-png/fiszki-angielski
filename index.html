  <style>
    :root{--bg:#07111f;--panel:#101d31;--panel2:#16263e;--text:#f7fafc;--muted:#9fb0c8;--mint:#6ee7b7;--blue:#60a5fa;--red:#fb7185;--line:#2a3c56}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 10% 10%,#14335a 0,transparent 32%),radial-gradient(circle at 90% 90%,#12392f 0,transparent 28%),var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    button,select{font:inherit}.app{width:min(760px,100%);margin:auto;padding:24px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}.brand p{color:var(--muted);margin:3px 0 0;font-size:.9rem}.select{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}

<body>
<main class="app">
  <header class="top"><div class="brand"><h1>Fiszki: angielski</h1><p>Kliknij kartę, żeby ją odwrócić</p></div><div class="selectors"><label for="lesson">Lekcja</label><select id="lesson" class="select"><option value="1">Lekcja 1</option><option value="2">Lekcja 2</option><option value="3">Lekcja 3</option><option value="4">Lekcja 4</option><option value="all">Wszystkie lekcje</option></select><select id="direction" class="select" aria-label="Kierunek nauki"><option value="en">EN → PL</option><option value="pl">PL → EN</option></select><button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false">☀️ Tryb jasny</button></div></header>

    <div class="actions"><button class="btn again" id="again">↺ Jeszcze powtórzę</button><button class="btn know" id="know">✓ Umiem</button></div>
    <div class="tools"><button class="tool" id="soundToggle" aria-pressed="true">🔊 Auto-dźwięk: włączony</button><button class="tool" id="speak">▶ Odsłuchaj fiszkę</button><button class="tool" id="shuffle">⤨ Losuj kolejność</button><button class="tool" id="reset">↺ Zacznij od nowa</button></div>
  </section>

  <p class="foot">Skróty: spacja — odwróć · S — odsłuchaj · ← — powtórz · → — umiem</p>

];
const decks={"1":lesson1,"2":lesson2,"3":lesson3,"4":lesson4,"all":[...lesson1,...lesson2,...lesson3,...lesson4]};
let cards=decks["1"];
let queue=[],missed=[],known=0,total=cards.length,speechTimer,autoSound=localStorage.getItem('fiszkiAutoSound')!=='off';const $=id=>document.getElementById(id);
function progressKey(){return 'fiszkiProgress_'+$('lesson').value}
function load(){cards=decks[$('lesson').value];total=cards.length;const saved=JSON.parse(localStorage.getItem(progressKey())||($('lesson').value==='1'?localStorage.getItem('fiszkiProgress'):'null')||'null');if(saved&&Array.isArray(saved.queue)&&saved.queue.length&&saved.queue.every(i=>Number.isInteger(i)&&i>=0&&i<cards.length)){queue=saved.queue;missed=saved.missed||[];known=saved.known||0}else if(saved&&Array.isArray(saved.queue)&&saved.queue.length===0){queue=[];missed=saved.missed||[];known=saved.known||0;}else reset(false);render()}
function save(){localStorage.setItem(progressKey(),JSON.stringify({queue,missed,known}))}
function reset(ask=true){if(ask&&!confirm('Wyzerować postęp i zacząć od początku?'))return;queue=cards.map((_,i)=>i);missed=[];known=0;total=cards.length;save();$('done').style.display='none';$('study').style.display='block';render()}
function render(){if(typeof stopVoice==='function')stopVoice();if(!queue.length)return finish();$('done').style.display='none';$('study').style.display='block';const [en,pl]=cards[queue[0]],rev=$('direction').value==='pl';$('frontText').textContent=rev?pl:en;$('backText').textContent=rev?en:pl;$('frontTag').textContent=rev?'Polski':'Angielski';$('backTag').textContent=rev?'Angielski':'Polski';$('card').classList.remove('flipped');$('left').textContent=queue.length;$('known').textContent=known;$('repeat').textContent=missed.length;$('bar').style.width=((total-queue.length)/total*100)+'%';updateSoundButton();save();if(typeof prepareVoiceCard==='function'&&voiceEnabled())prepareVoiceCard();clearTimeout(speechTimer);if(autoSound&&(!voiceEnabled()||!voiceAuto))speechTimer=setTimeout(()=>speak(true),280)}
function rate(ok){if(!queue.length)return;const i=queue.shift();if(ok){known++;missed=missed.filter(x=>x!==i)}else{if(!missed.includes(i))missed.push(i);queue.push(i)}render()}
function applyTheme(mode){const light=mode==='light';document.body.classList.toggle('light',light);$('themeToggle').textContent=light?'🌙 Tryb ciemny':'☀️ Tryb jasny';$('themeToggle').setAttribute('aria-pressed',String(light));document.querySelector('meta[name="theme-color"]').content=light?'#ffffff':'#111827';localStorage.setItem('fiszkiTheme',mode)}
$('themeToggle').onclick=()=>applyTheme(document.body.classList.contains('light')?'dark':'light');
applyTheme(localStorage.getItem('fiszkiTheme')==='light'?'light':'dark');
function finish(){if(typeof stopVoice==='function')stopVoice(true);if(typeof stopVoice==='function')stopVoice();clearTimeout(speechTimer);if('speechSynthesis' in window)speechSynthesis.cancel();$('study').style.display='none';$('done').style.display='block';$('left').textContent=0;$('known').textContent=known;$('repeat').textContent=missed.length;$('bar').style.width='100%';$('summary').textContent=`Umiesz ${known} z ${total} fiszek. Do powtórki: ${missed.length}.`;$('repeatMissed').style.display=missed.length?'inline-block':'none';save()}
function speak(auto=false){if(!('speechSynthesis' in window)||!queue.length){if(!auto)alert('Ta przeglądarka nie obsługuje odczytywania tekstu. Spróbuj otworzyć plik w Chrome, Edge lub Safari.');return}const rev=$('direction').value==='pl',back=$('card').classList.contains('flipped'),isPolish=back?!rev:rev;let text=cards[queue[0]][isPolish?1:0].replace(/\s*\/\s*/g,', ');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=isPolish?'pl-PL':'en-GB';u.rate=.86;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith(isPolish?'pl':'en'))||null;speechSynthesis.speak(u)}
function updateSoundButton(){$('soundToggle').textContent=autoSound?'🔊 Auto-dźwięk: włączony':'🔇 Auto-dźwięk: wyłączony';$('soundToggle').setAttribute('aria-pressed',String(autoSound))}
function toggleSound(){autoSound=!autoSound;localStorage.setItem('fiszkiAutoSound',autoSound?'on':'off');clearTimeout(speechTimer);if(!autoSound&&'speechSynthesis' in window)speechSynthesis.cancel();updateSoundButton();if(autoSound)speak(true)}
$('card').onclick=()=>$('card').classList.toggle('flipped');$('know').onclick=()=>rate(true);$('again').onclick=()=>rate(false);$('direction').onchange=()=>{stopVoice();render()};$('lesson').onchange=()=>{stopVoice();if('speechSynthesis' in window)speechSynthesis.cancel();load()};$('reset').onclick=()=>{stopVoice();reset(true)};$('shuffle').onclick=()=>{queue.sort(()=>Math.random()-.5);render()};$('restartDone').onclick=()=>{stopVoice(true);reset(false)};$('repeatMissed').onclick=()=>{queue=[...missed];known=total-missed.length;$('done').style.display='none';$('study').style.display='block';render()};

// Tryb głosowy: przeglądarka kontroluje uprawnienia do mikrofonu.
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,voiceAttempts=0,voiceToken=0,voiceTimer=null,voiceActive=false,voiceAuto=false;
const voiceEnabled=()=> $('voiceMode').value==='voice';
function voiceMessage(message,heard=''){$('voiceStatus').textContent=message;$('voiceHeard').textContent=heard}
function stopVoice(disableAuto=false){voiceToken++;clearTimeout(voiceTimer);if(disableAuto)voiceAuto=false;if(recognition){const old=recognition;recognition=null;old.onresult=null;old.onerror=null;old.onend=null;try{old.abort()}catch(e){}}voiceActive=false;$('micButton').textContent='🎤 Rozpocznij / wznów'}
function normalizeAnswer(value){return value.toLocaleLowerCase('pl').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9ąćęłńóśźż ]/gi,' ').replace(/\s+/g,' ').trim()}
function acceptedAnswers(answer){return answer.split(/\s+\/\s+|\s*;\s*/).map(x=>normalizeAnswer(x)).filter(Boolean)}
function isCorrectVoice(heard){const answer=cards[queue[0]][$('direction').value==='pl'?0:1];return acceptedAnswers(answer).includes(normalizeAnswer(heard))}
function voiceSay(text,lang,done){let finished=false;const complete=()=>{if(finished)return;finished=true;clearTimeout(voiceTimer);done()};if(!('speechSynthesis' in window)){voiceTimer=setTimeout(complete,500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.88;u.onend=complete;u.onerror=complete;speechSynthesis.speak(u);voiceTimer=setTimeout(complete,Math.max(2200,text.length*110))}
function voiceNext(ok){stopVoice();voiceTimer=setTimeout(()=>{rate(ok);if(voiceEnabled()&&queue.length&&voiceAuto)voiceTimer=setTimeout(()=>startVoice(),650)},550)}
function voiceFeedback(ok,finalFailure=false){const token=voiceToken;const correct=cards[queue[0]][$('direction').value==='pl'?0:1];$('card').classList.add('flipped');voiceMessage((ok?'✅ Dobrze!':finalFailure?'❌ Dwie błędne próby — wróci do powtórki.':'❌ Spróbuj ponownie (próba 2/2).')+' Poprawna odpowiedź: '+correct,$('voiceHeard').textContent);voiceSay(correct,$('direction').value==='pl'?'en-GB':'pl-PL',()=>{if(token!==voiceToken||!voiceEnabled())return;if(ok||finalFailure)voiceNext(ok);else voiceTimer=setTimeout(()=>{$('card').classList.remove('flipped');if(voiceAuto)startVoice()},550)})}
function startVoice(){if(!voiceEnabled()||!queue.length||voiceActive)return;if(!SpeechRecognitionAPI){voiceMessage('Rozpoznawanie mowy nie jest dostępne w tej przeglądarce.');voiceAuto=false;return}clearTimeout(voiceTimer);if('speechSynthesis' in window)speechSynthesis.cancel();clearTimeout(speechTimer);const token=++voiceToken;const rec=new SpeechRecognitionAPI();recognition=rec;voiceActive=true;rec.lang=$('direction').value==='pl'?'en-GB':'pl-PL';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;let processed=false;$('micButton').textContent='⏹ Zatrzymaj';voiceMessage('🎙️ Słucham — próba '+(voiceAttempts+1)+'/2');rec.onresult=e=>{if(token!==voiceToken)return;processed=true;voiceActive=false;recognition=null;$('micButton').textContent='🎤 Rozpocznij / wznów';const alternatives=Array.from(e.results[0]).map(x=>x.transcript);$('voiceHeard').textContent='Usłyszano: „'+(alternatives[0]||'')+'”';const ok=alternatives.some(isCorrectVoice);voiceAttempts++;voiceFeedback(ok,!ok&&voiceAttempts>=2)};rec.onerror=e=>{if(token!==voiceToken||processed)return;processed=true;voiceActive=false;recognition=null;voiceAuto=false;$('micButton').textContent='🎤 Rozpocznij / wznów';voiceMessage(e.error==='not-allowed'?'Chrome nie zezwolił na mikrofon. W ustawieniach witryny ustaw Mikrofon → Zezwalaj.':e.error==='no-speech'?'Nie wykryto mowy. Dotknij „Rozpocznij / wznów”, aby kontynuować.':'Rozpoznawanie przerwane ('+e.error+'). Dotknij „Rozpocznij / wznów”.')};rec.onend=()=>{if(token!==voiceToken||processed)return;voiceActive=false;recognition=null;voiceAuto=false;$('micButton').textContent='🎤 Rozpocznij / wznów';voiceMessage('Nie rozpoznano wypowiedzi. Dotknij „Rozpocznij / wznów” — próba nie przepada.')};try{rec.start()}catch(e){voiceActive=false;recognition=null;voiceAuto=false;voiceMessage('Chrome nie uruchomił nasłuchiwania. Dotknij przycisku ponownie. '+e.message)}}
function prepareVoiceCard(){if(!voiceEnabled()||!queue.length)return;voiceAttempts=0;voiceMessage(voiceAuto?'Następna fiszka — zaraz włączę mikrofon.':'Dotknij mikrofonu raz, aby rozpocząć serię odpowiedzi.','');$('micButton').textContent='🎤 Rozpocznij / wznów'}
$('voiceMode').onchange=()=>{stopVoice(true);const active=voiceEnabled();$('micButton').hidden=!active;if(active){if(!SpeechRecognitionAPI)voiceMessage('Rozpoznawanie mowy nie jest dostępne w tej przeglądarce.');else prepareVoiceCard()}else voiceMessage('Tryb tradycyjny — oceniaj fiszki przyciskami.','')};
$('micButton').onclick=()=>{if(voiceActive){stopVoice(true);voiceMessage('Zatrzymano. Dotknij mikrofonu, aby wznowić.')}else{voiceAuto=true;startVoice()}};
$('soundToggle').onclick=toggleSound;$('speak').onclick=()=>speak(false);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();$('card').click()}if(e.key.toLowerCase()==='s')speak(false);if(e.key==='ArrowLeft')rate(false);if(e.key==='ArrowRight')rate(true)});load();
</script>
